[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-scheduling-repro"
version = "0.1.0"
description = "Discrete-event 1P1D routing and expert placement reproduction"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_repro.vendor" = ["LICENSE.omni-eplb", "PROVENANCE.json"]
